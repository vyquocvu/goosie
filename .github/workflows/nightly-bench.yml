name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  actions: write

jobs:
  nightly:
    name: Nightly frame-path benchmarks (macOS, real CVDisplayLink)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run all tests
        run: go test -count=1 ./...

      - name: Run the M1 scroll benchmarks
        run: |
          mkdir -p testdata/benchmarks/nightly
          go test -run='^$' -bench='BenchmarkWarmScroll|BenchmarkColdScrollBurst' \
            -benchmem -benchtime=200x -count=3 -timeout=20m ./test/gate \
            > testdata/benchmarks/nightly/m1-bench.txt 2>&1
          cat testdata/benchmarks/nightly/m1-bench.txt

      - name: Run the gate through a real window
        run: |
          go run ./cmd/goosie -gate -backend native -scene checkerboard -frames 600 \
            -out testdata/benchmarks/nightly/m1-gate.json \
            2> testdata/benchmarks/nightly/m1-report.txt
          cat testdata/benchmarks/nightly/m1-report.txt

      - name: Require that the run was paced by a display
        run: |
          if ! grep -q 'backend=darwin' testdata/benchmarks/nightly/m1-report.txt; then
            echo "::error::the gate run did not open a macOS window; this runner has no display session to pace it"
            exit 1
          fi

      - name: Assert the M1 budgets
        run: |
          scripts/v2-gate-check.sh testdata/benchmarks/nightly/m1-gate.json \
            -mean 16 -p99 33 \
            -bench testdata/benchmarks/nightly/m1-bench.txt -warm-ms 5 -cold-ms 8

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-${{ github.run_id }}
          path: |
            testdata/benchmarks/nightly/m1-bench.txt
            testdata/benchmarks/nightly/m1-report.txt
            testdata/benchmarks/nightly/m1-gate.json
          retention-days: 90
