name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all packages
        run: go build ./...
      - name: go vet (all analyzers)
        run: go vet -all ./...
      - name: Run unit tests
        # Includes ./internal/archtest, so the import-boundary, cgo and
        # mutable-global rules are gated here.
        run: go test -count=1 ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with race detector
        run: go test -race ./...

  darwin:
    name: macOS native path (darwin + cgo)
    # Every other job is ubuntu-latest, and internal/platform/darwin is behind
    # `//go:build darwin && cgo`, so before this job the window shim, the clipboard,
    # the save panel and the AVFoundation backend were only ever compiled at release
    # tag time - the first build of the shipped macOS binary was the release build.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fail if the cgo path was silently excluded
        # A build-tag mistake would make this job green while testing the Linux stub
        # backend. Check the source list, not just the exit status.
        run: |
          set -e
          sources=$(go list -f '{{join .CgoFiles " "}} {{join .MFiles " "}}' ./internal/platform/darwin/)
          echo "compiled native sources: $sources"
          for want in window.go media.go clipboard.go dialog.go shim_darwin.m media_darwin.m; do
            case " $sources " in
              *" $want "*) ;;
              *) echo "::error::$want was not compiled on darwin+cgo"; exit 1 ;;
            esac
          done
      - name: Build all packages, including the native backends
        run: go build ./...
      - name: go vet (all analyzers)
        run: go vet -all ./...
      - name: Native and chrome tests under the race detector
        # internal/platform/darwin owns the only tests in the repo that prove a real
        # decode happened; they need no display and no window, so a runner with nobody
        # logged in can still run them.
        run: go test -race -count=1 -v ./internal/platform/darwin/ ./test/platform/ ./internal/archtest/ ./cmd/goosie/

  audit:
    name: Dependency vulnerability scan
    # Advisory status is a property of go.sum and the OSV database, not of a
    # branch, so this runs on main and weekly rather than on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  wpt-pilot:
    name: WPT pilot reftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build goosie binary for the harness
        run: go build -o goosie ./cmd/goosie
      - name: Run local WPT-style reftests (no checkout download)
        run: go test -count=1 -timeout 10m -run TestWPTPilot -v ./test/wpt/

  parity:
    name: Render parity vs Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build goosie binary for the harness
        run: go build -o goosie ./cmd/goosie
      - name: Install Playwright Chromium and scoring deps
        run: |
          pip install playwright==1.49.1 pillow numpy
          python -m playwright install chromium --with-deps
      - name: Render both sides fresh and score (fail-closed)
        run: python3 testdata/parity.py --render --render-chromium --binary ./goosie --junit /tmp/parity-junit.xml --json /tmp/parity.json
      - name: Upload render outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-outputs
          path: |
            /tmp/goosie-renders
            /tmp/playwright-renders
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            /tmp/parity.json
            /tmp/parity-junit.xml
