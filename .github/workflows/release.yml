name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    strategy:
      matrix:
        platform:
          - goos: darwin
            goarch: arm64
            artifact: goosie-darwin-arm64
          - goos: darwin
            goarch: amd64
            artifact: goosie-darwin-amd64
          - goos: linux
            goarch: amd64
            artifact: goosie-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: goosie-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: goosie-windows-amd64.exe
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build ${{ matrix.platform.goos }} ${{ matrix.platform.goarch }}
        run: |
          mkdir -p build
          GOOS=${{ matrix.platform.goos }} GOARCH=${{ matrix.platform.goarch }} go build -o build/${{ matrix.platform.artifact }} ./cmd/browser

      - name: Package
        if: matrix.platform.goos != 'windows'
        run: |
          cd build
          tar -czvf ${{ matrix.platform.artifact }}.tar.gz ${{ matrix.platform.artifact }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/${{ matrix.platform.artifact }}
            ${{ matrix.platform.goos != 'windows' && format('build/{0}.tar.gz', matrix.platform.artifact) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}