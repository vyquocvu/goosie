name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64, runner: macos-latest}
          - {goos: darwin, goarch: amd64, runner: macos-13}
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: windows, goarch: amd64, runner: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          name="goosie-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "dist/${name}${ext}" ./cmd/goosie
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell Compress-Archive -Path "${name}${ext}" -DestinationPath "${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}${ext}"
          fi
          shasum -a 256 * > "${name}.sha256"
      - name: Smoke test
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          binary="dist/goosie-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          chmod +x "${binary}" 2>/dev/null || true
          echo "PASS: smoke test for ${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
