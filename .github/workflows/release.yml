name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64, runner: macos-latest}
          - {goos: darwin, goarch: amd64, runner: macos-13}
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: windows, goarch: amd64, runner: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux Fyne dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Test
        run: go test ./... -short
      - name: Build and package
        shell: bash
        run: |
          mkdir -p dist
          name="goosie-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "dist/${name}${ext}" ./cmd/browser
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell Compress-Archive -Path "${name}${ext}" -DestinationPath "${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}${ext}"
          fi
          shasum -a 256 * > "${name}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
