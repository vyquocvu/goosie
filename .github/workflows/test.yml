name: Test and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Get Playwright Version
      id: playwright-version
      run: |
        # Extract Playwright version from go.mod to use in cache key
        PLAYWRIGHT_VERSION=$(grep "github.com/playwright-community/playwright-go" go.mod | awk '{print $2}')
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

    - name: Cache Playwright Browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev

    - name: Install Playwright (browsers + driver + system deps)
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      run: |
        # Install Playwright driver, browsers, and system dependencies on a cache miss
        go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps

    - name: Install Playwright driver and system deps (cache hit)
      if: steps.cache-playwright.outputs.cache-hit == 'true'
      run: |
        # Browsers are cached, but the driver binary must still be installed.
        # install-deps ensures OS-level library dependencies are present.
        go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium

    - name: Build Project
      run: make build

    - name: Run Tests
      run: make test
      env:
        HEADLESS: true

    - name: Upload Test Artifacts (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts-${{ github.run_id }}
        path: |
          testdata/results/**/*
          **/*.log
        retention-days: 5
