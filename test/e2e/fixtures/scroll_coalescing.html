<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scroll Coalescing</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f4f4f4; }
    header { height: 56px; background: #1f5f4a; }
    main { padding: 8px 0; }
    section { height: 100px; margin: 8px 0; background: #ffffff; }
    section.alt { background: #e3f0ea; }
  </style>
</head>
<body>
  <header></header>
  <main>
    <section></section>
    <section class="alt"></section>
    <section></section>
    <section class="alt"></section>
  </main>
</body>
</html>
