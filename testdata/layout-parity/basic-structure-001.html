<!doctype html>
<html><head><meta charset="utf-8"><title>Basic structure</title>
<style>
html,body{margin:0;padding:0;}
#heading{display:block;width:400px;height:40px;margin:10px 0 0 10px;}
#paragraph{display:block;width:400px;height:50px;margin:10px 0 0 10px;}
#list{display:block;width:400px;height:70px;margin:10px 0 0 10px;padding:0;list-style:none;}
#item1{display:block;width:300px;height:30px;margin:0;}
#item2{display:block;width:300px;height:30px;margin:5px 0 0 0;}
#link{display:block;width:120px;height:20px;margin:5px 0 0 10px;}
</style></head><body>
<h1 id="heading">Heading</h1>
<p id="paragraph">A paragraph of text.</p>
<ul id="list"><li id="item1">First item</li><li id="item2">Second item</li></ul>
<a id="link" href="#">A link</a>
</body></html>
