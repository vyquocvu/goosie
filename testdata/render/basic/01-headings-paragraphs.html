<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basic HTML Structure</title>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <p>This is a paragraph with some text content.</p>
    <p>This is another paragraph with <strong>bold text</strong> and <em>italic text</em>.</p>

    <p>A paragraph with <a href="#">a link</a> inside it.</p>

    <p>Line break test:<br>Second line<br>Third line</p>

    <hr>

    <p>After horizontal rule.</p>
</body>
</html>
