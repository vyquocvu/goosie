<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebP image decoding</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 40px; color: #202124; }
    figure { width: 240px; margin: 0; }
    img { display: block; width: 240px; height: 180px; object-fit: fill; }
    figcaption { margin-top: 12px; }
  </style>
</head>
<body>
  <figure>
    <img alt="WebP image rendered as a scaled 4 by 4 bitmap"
      src="data:image/webp;base64,UklGRjwAAABXRUJQVlA4IDAAAADQAQCdASoEAAQAAUAmJaACdLoB+AADsAD+8ut//NgVzXPv9//S4P0uD9Lg/9KQAAA=">
    <figcaption>WebP image must decode and paint at the requested size.</figcaption>
  </figure>
</body>
</html>
