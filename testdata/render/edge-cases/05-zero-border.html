<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Explicit zero-width border</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .drawer {
      position: fixed;
      inset: 0 auto 0 0;
      width: 400px;
      height: 100%;
      border: 0 solid red;
      transform: none;
      visibility: visible;
    }
    main { margin-left: 420px; padding-top: 180px; }
  </style>
</head>
<body>
  <div class="drawer"></div>
  <main>
    <h1>Helpful products, built with you in mind</h1>
    <p>Text should render beside a zero-width red border.</p>
  </main>
</body>
</html>
