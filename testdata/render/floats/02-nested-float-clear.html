<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Floats - Inheritance Through Plain Blocks</title>
    <style>
        body { margin: 20px; font-family: sans-serif; font-size: 14px; line-height: 20px; }
        h2 { margin: 0 0 8px; }
        .outer { background: #ecf0f1; padding: 8px; margin: 0 0 18px; }
        /* A plain block does not establish a formatting context: the float
           inside it still belongs to the outer block, so a later sibling that
           clears must land below that float, not beside it. */
        .plain { background: #d5dbdb; }
        .f-left { float: left; width: 130px; height: 80px; background: #e74c3c; margin: 0 8px 8px 0; }
        .f-right { float: right; width: 130px; height: 100px; background: #3498db; margin: 0 0 8px 8px; }
        .clear-left { clear: left; background: #27ae60; height: 24px; }
        .clear-both { clear: both; background: #8e44ad; height: 24px; }
        .flow { background: #f7dc6f; height: 30px; }
        .fc { overflow: hidden; background: #d5dbdb; }
    </style>
</head>
<body>
    <h2>Float nested one plain block deep, cleared by an outer sibling</h2>
    <div class="outer">
        <div class="plain">
            <div class="f-left"></div>
            <div class="flow"></div>
        </div>
        <div class="clear-left"></div>
    </div>

    <h2>Two nested floats in two plain blocks, cleared once at the end</h2>
    <div class="outer">
        <div class="plain">
            <div class="f-left"></div>
            <div class="flow"></div>
        </div>
        <div class="plain">
            <div class="f-right"></div>
            <div class="flow"></div>
        </div>
        <div class="clear-both"></div>
    </div>

    <h2>A formatting context contains its own floats: the outer sibling must not be pushed down</h2>
    <div class="outer">
        <div class="fc">
            <div class="f-left"></div>
            <div class="flow"></div>
        </div>
        <div class="flow"></div>
    </div>
</body>
</html>
