<!DOCTYPE html>
<html>
<head>
    <title>Box Model - Padding</title>
    <style>
        body { margin: 20px; }
        .box {
            width: 200px;
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
        }
        .padding-uniform { padding: 20px; }
        .padding-top { padding-top: 40px; }
        .padding-right { padding-right: 60px; }
        .padding-bottom { padding-bottom: 30px; }
        .padding-left { padding-left: 50px; }
        .padding-shorthand { padding: 10px 20px 30px 40px; }
    </style>
</head>
<body>
    <h2>Padding Tests</h2>

    <div class="box padding-uniform">Uniform padding: 20px</div>
    <br>
    <div class="box padding-top">Padding-top: 40px</div>
    <br>
    <div class="box padding-right">Padding-right: 60px</div>
    <br>
    <div class="box padding-bottom">Padding-bottom: 30px</div>
    <br>
    <div class="box padding-left">Padding-left: 50px</div>
    <br>
    <div class="box padding-shorthand">Shorthand: 10px 20px 30px 40px</div>
</body>
</html>
