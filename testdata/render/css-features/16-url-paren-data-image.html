<!DOCTYPE html>
<html>
<head>
    <title>A url() payload containing ')' reaches the background whole (GOOSIE-CSSURLPAREN-001)</title>
    <style>
        /* A quoted CSS url() token ends at the ')' that follows the closing quote
           (CSS Syntax L3 4.3.9), so the payload may contain '(' , ')' and ';'.
           The second-pass readers in this engine used strings.IndexByte(rest, ')')
           anyway, so an SVG data URI whose fill is written rgb(0,0,255) was cut
           there and the truncated image decoded to nothing: the band stayed white.

           Chromium, measured on this machine (800x600 viewport, DPR 1), paints
           every band below solid (0,0,255): 720x40 = 28,800 blue pixels each.
           Goosie before the fix painted k0 and k1 only.  The discriminator is the
           parenthesis in the payload, not the quoting: k0 and k1 are the
           parenthesis-free controls, one quoted and one unquoted.

           k1 is written unquoted with every delimiter percent-encoded, because a
           literal quote or '(' inside an unquoted url() is a bad-url in Chromium
           (measured: getComputedStyle().backgroundImage reports "none" for the
           literal form).  Goosie is deliberately more lenient there, and that
           leniency is pinned by unit tests rather than by this parity fixture.

           k3 carries '(' and ')' in a transform with a parenthesis-free colour,
           so a cut inside the transform also shows up.  k4 is the same failing
           payload inside the background shorthand. */
        html, body { margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #ffffff; color: #1a1a1a; }
        h1 { font-size: 17px; margin: 10px 16px 4px 16px; }
        p { font-size: 12px; margin: 0 16px 3px 16px; }
        .band { width: 720px; height: 40px; margin: 0 16px 6px 16px; }

        /* k0: quoted, parenthesis-free. */
        .k0 { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='40'><rect width='720' height='40' fill='%230000ff'/></svg>"); }
        /* k1: unquoted, percent-encoded, parenthesis-free. */
        .k1 { background-image: url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27720%27%20height=%2740%27%3E%3Crect%20width=%27720%27%20height=%2740%27%20fill=%27%230000ff%27/%3E%3C/svg%3E); }
        /* k2: the failing shape — a ')' inside a quoted payload. */
        .k2 { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='40'><rect width='720' height='40' fill='rgb(0,0,255)'/></svg>"); }
        /* k3: '(' and ')' inside a quoted payload, colour parenthesis-free. */
        .k3 { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='40'><rect width='720' height='40' fill='%230000ff' transform='translate(0,0)'/></svg>"); }
        /* k4: the same failing payload in the background shorthand. */
        .k4 { background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='40'><rect width='720' height='40' fill='rgb(0,0,255)'/></svg>") no-repeat; }

        /* Control: a plain CSS colour, so a fully blank render cannot be read as
           "the parser dropped every background". */
        .control { background-color: #0000ff; }
    </style>
</head>
<body>
    <h1>url() payloads containing ')'</h1>
    <p>k0 quoted, parenthesis-free &mdash; must stay blue</p>
    <div class="band k0"></div>
    <p>k1 unquoted, percent-encoded, parenthesis-free &mdash; must stay blue</p>
    <div class="band k1"></div>
    <p>k2 quoted, fill rgb(0,0,255) &mdash; the defect</p>
    <div class="band k2"></div>
    <p>k3 quoted, '(' and ')' in a transform</p>
    <div class="band k3"></div>
    <p>k4 the same payload in the background shorthand</p>
    <div class="band k4"></div>
    <p>control: background-color</p>
    <div class="band control"></div>
</body>
</html>
