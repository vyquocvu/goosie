<!DOCTYPE html>
<html>
<head>
<title>Grid area numeric shorthand</title>
<style>
  body { margin: 0; font: 16px Arial, Helvetica, sans-serif; }
  .grid {
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    justify-items: center;
    align-items: center;
    width: 1000px;
    height: 290px;
    background: #e8f0fe;
  }
  .logo { grid-area: 1 / 1; width: 272px; height: 92px; background: #1a73e8; }
  .tagline { grid-area: 1 / 1; width: 300px; height: 40px; background: #fff; color: #202124; text-align: center; }
  .footer { grid-area: 1 / 1; width: 160px; height: 20px; margin-top: auto; background: #34a853; }
</style>
</head>
<body>
  <div class="grid">
    <div class="logo"></div>
    <div class="tagline">Bạn đang nghĩ gì?</div>
    <div class="footer"></div>
  </div>
</body>
</html>
