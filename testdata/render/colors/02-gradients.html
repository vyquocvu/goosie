<!DOCTYPE html>
<html>
<head>
    <title>Colors - Solid Backgrounds</title>
    <style>
        body { margin: 20px; }
        .box {
            padding: 20px;
            margin: 10px 0;
            border: 2px solid #333;
            color: white;
        }
        .bg-red { background-color: #e74c3c; }
        .bg-green { background-color: #2ecc71; }
        .bg-blue { background-color: #3498db; }
        .bg-purple { background-color: #9b59b6; }
        .bg-orange { background-color: #e67e22; }
    </style>
</head>
<body>
    <h2>Solid Background Colors</h2>

    <div class="box bg-red">Red background (#e74c3c)</div>
    <div class="box bg-green">Green background (#2ecc71)</div>
    <div class="box bg-blue">Blue background (#3498db)</div>
    <div class="box bg-purple">Purple background (#9b59b6)</div>
    <div class="box bg-orange">Orange background (#e67e22)</div>

    <h3>Multiple colors on one element</h3>
    <div style="background-color: #34495e; color: #ecf0f1; padding: 20px; border: 3px solid #2c3e50;">
        Dark background with light text
    </div>
</body>
</html>
