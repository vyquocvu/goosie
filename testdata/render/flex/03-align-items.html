<!DOCTYPE html>
<html>
<head>
    <title>Flexbox - Align Items</title>
    <style>
        body { margin: 20px; font-family: sans-serif; }
        .flex-container {
            display: flex;
            height: 150px;
            background-color: #ecf0f1;
            padding: 10px;
            margin: 20px 0;
            border: 2px solid #3498db;
        }
        .flex-item {
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            margin: 5px;
        }
        .align-start { align-items: flex-start; }
        .align-end { align-items: flex-end; }
        .align-center { align-items: center; }
        .align-stretch { align-items: stretch; }
        .align-baseline { align-items: baseline; }
        .item-tall { height: 80px; }
        .item-short { height: 40px; }
        .item-medium { height: 60px; }
    </style>
</head>
<body>
    <h2>Align Items</h2>

    <h3>flex-start</h3>
    <div class="flex-container align-start">
        <div class="flex-item item-tall">Tall</div>
        <div class="flex-item item-short">Short</div>
        <div class="flex-item item-medium">Medium</div>
    </div>

    <h3>flex-end</h3>
    <div class="flex-container align-end">
        <div class="flex-item item-tall">Tall</div>
        <div class="flex-item item-short">Short</div>
        <div class="flex-item item-medium">Medium</div>
    </div>

    <h3>center</h3>
    <div class="flex-container align-center">
        <div class="flex-item item-tall">Tall</div>
        <div class="flex-item item-short">Short</div>
        <div class="flex-item item-medium">Medium</div>
    </div>

    <h3>stretch (default)</h3>
    <div class="flex-container align-stretch">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <h3>baseline</h3>
    <div class="flex-container align-baseline">
        <div class="flex-item item-tall" style="font-size: 20px;">Large text</div>
        <div class="flex-item item-short" style="font-size: 12px;">Small text</div>
        <div class="flex-item item-medium" style="font-size: 16px;">Normal text</div>
    </div>
</body>
</html>
