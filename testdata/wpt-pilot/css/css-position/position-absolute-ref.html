<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Position: absolute positioning reference</title>
<style>
body { margin: 0; }
.container { position: relative; width: 300px; height: 300px; background: #eee; }
.box { position: absolute; top: 50px; left: 50px; width: 100px; height: 100px; background: #ff0000; }
</style>
</head>
<body>
<div class="container">
  <div class="box"></div>
</div>
</body>
</html>
