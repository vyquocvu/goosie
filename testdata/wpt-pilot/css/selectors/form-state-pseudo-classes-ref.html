<!doctype html>
<meta charset="utf-8">
<title>Form state pseudo-class matching reference</title>
<style>
  html, body { margin: 0; }
  .mark { position: absolute; left: 0; width: 120px; height: 24px; background: green; }
  #checked-mark { top: 0; }
  #enabled-mark { top: 32px; }
  #disabled-mark { top: 64px; }
  #placeholder-mark { top: 96px; }
  #legend-mark { top: 128px; }
  #fieldset-mark { top: 160px; }
</style>
<span class="mark" id="checked-mark"></span>
<span class="mark" id="enabled-mark"></span>
<span class="mark" id="disabled-mark"></span>
<span class="mark" id="placeholder-mark"></span>
<span class="mark" id="legend-mark"></span>
<span class="mark" id="fieldset-mark"></span>
