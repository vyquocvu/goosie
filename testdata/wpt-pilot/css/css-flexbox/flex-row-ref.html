<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Flexbox: row direction reference</title>
<style>
body { margin: 0; }
.container { width: 300px; }
.item { width: 100px; height: 100px; display: inline-block; vertical-align: top; }
.a { background: red; }
.b { background: green; }
.c { background: blue; }
</style>
</head>
<body>
<div class="container">
  <div class="item a"></div><div class="item b"></div><div class="item c"></div>
</div>
</body>
</html>
